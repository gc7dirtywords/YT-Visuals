[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-visuals"
version = "0.1.0"
description = "Local visual asset catalog foundation for a YouTube production workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "Flask>=3.1,<4",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "Pillow>=10,<13",
    "pydantic>=2.8,<3",
    "reportlab>=4.2,<5",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
yt-visuals = "yt_visuals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yt_visuals.producer" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
